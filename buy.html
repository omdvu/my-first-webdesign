<style>
body{
	color:white;
}

table{
	width:30%;
	margin-left:auto;
	margin-right:auto;
}
label{
	font-size:18px;
	font-family:helvetica;
}
input{
	background-color:transparent;
	border-bottom:2px solid gray;
	border-top:0px;
	border-left:0px;
	border-right:0px;
	color:white;
	width:100%;
	height:auto;
}
input[placeholder]{
	text-align:center;
	font-size:12px;
	
}
select{
	text-align:center;
	width:100%;

	background-color:transparent;
	border-color:transparent;
	color:white;
}
option{
	background-color:black;
	color:white;
	border-color:black;
}
optgroup{
	background-color:rgb(60,60,60);
	color:rgba(255,122,103,1);
}
input[type=radio]{
	width:auto;
	height:auto;
}

input[type=submit]{
	width:20%;
	height:auto;
	border:2px solid rgba(255,122,103,1);
	border-radius:3px;
	background-color:rgba(255,122,103,1);
	color:white;
}
textarea{
	background-color:transparent;
	color:white;
}
input[type=submit]:hover{
	animation-name:sub;
	animation-duration:0.3s;
	animation-fill-mode:forwards;
}
td.cent{
	text-align:center
}
#total{
	font-family:helvetica;
	font-size:18px;
}
@keyframes sub{
	0%{
	border-radius:3px;
	padding:1px;
	}
	20%{
	border-radius:4px;
	padding:1px;
	text-shadow:white 0px 0px 1px;
	}
	40%{
	border-radius:4px;
	padding:2px;
	text-shadow:white 0px 0px 1px;
	}
	60%{
	border-radius:5px;
	padding:2px;
	text-shadow:white 0px 0px 3px;
	}
	80%{
	border-radius:5px;
	padding:2px;
	text-shadow:white 0px 0px 4px;
	}
	100%{
	border-radius:6px;
	padding:3px;
	text-shadow:white 0px 1px 5px;
	}
}
</style>

</head>
