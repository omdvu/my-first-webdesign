<html>
<head>
<style>
p{
	background-color:black;
	width:100px;
	height:100px;
	color:white;

}
p:hover{
	
	animation-name:idk;
	animation-duration: 5s;

}
@keyframes idk{
	0%{
		color:white;
		text-shadow:white 0px 2px 4px;
	}
	50%{
	color:rgba(60,60,60,0.6);
		text-shadow:pink 1px 3px 5px;
		background-color:white;
	}
	100%{
		color:rgba(60,60,60,0.9);
		text-shadow:pink 2px 4px 6px;
		background-color:white;		
	}
}
ul{
	
}
li{
	display:inline;
	padding:5px;
	width:100%;
}
</style>
</head>
<body>
<p>
jello
</p>
<ul>
<li>hi</li>
<li>hi</li>
</ul>
</body>

</html>
